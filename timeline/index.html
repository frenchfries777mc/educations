<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Timeline Battle</title>
<meta name="description" content="사건 카드를 연표의 알맞은 자리에 끼워 넣는 역사 대결 게임">
<meta name="theme-color" content="#0b0a10">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
  :root{ --bg:#0b0a10; --panel:#14121b; --panel2:#1b1824; --line:#2b2736; --text:#f2eee6; --dim:#968fa3; --fry:#ffc93c; --fry2:#ff8a3d; --gold:#e9c46a; --ok:#3fe0a0; --bad:#ff5468; }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--text);}
  body{font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif; font-size:16px; line-height:1.5; min-height:100vh; min-height:100dvh;
    padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px); overflow-x:hidden;}
  /* archive hall: warm spotlights, a long timeline rail with year ticks */
  .hall{position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden;
    background:
      radial-gradient(ellipse 40% 50% at 20% 0%, rgba(233,196,106,.13), transparent 70%),
      radial-gradient(ellipse 40% 50% at 80% 0%, rgba(233,196,106,.09), transparent 70%),
      radial-gradient(ellipse 70% 40% at 50% 110%, rgba(120,70,160,.18), transparent 70%),
      linear-gradient(180deg,#110f17,#0b0a10);}
  .hall .rail{position:absolute; left:0; right:0; bottom:46px; opacity:.6; height:2px; background:linear-gradient(90deg,transparent,rgba(233,196,106,.35),transparent);}
  .hall .rail::before{content:''; position:absolute; left:0; right:0; top:-8px; height:18px; background:repeating-linear-gradient(90deg, transparent 0 79px, rgba(233,196,106,.25) 79px 81px); -webkit-mask:linear-gradient(90deg,transparent,#000 20%,#000 80%,transparent); mask:linear-gradient(90deg,transparent,#000 20%,#000 80%,transparent);}
  .hall .yrs{position:absolute; left:0; right:0; bottom:20px; opacity:.7; display:flex; justify-content:space-around; font-family:'JetBrains Mono',monospace; font-size:12px; color:rgba(233,196,106,.22); letter-spacing:.1em;}
  .wrap{position:relative; z-index:1; max-width:1180px; margin:0 auto; padding:0 18px;}
  button,input,select{font:inherit; color:inherit;}
  button{cursor:pointer; touch-action:manipulation;}
  header{display:flex; align-items:center; justify-content:space-between; padding:16px 0 0; gap:12px;}
  .logo{display:flex; align-items:center; gap:10px; font-family:'Oswald',sans-serif; font-weight:600; font-size:19px; letter-spacing:.04em; color:var(--text); text-decoration:none;}
  .logo .fry{width:32px; height:32px; border-radius:9px; display:grid; place-items:center; font-size:18px; background:linear-gradient(135deg,var(--fry),var(--fry2)); box-shadow:0 6px 18px rgba(255,160,60,.25);}
  .logo b{color:var(--fry); font-weight:700;}
  .net{font-size:13px; color:var(--dim); display:flex; align-items:center; gap:7px; white-space:nowrap;}
  .net i{width:8px; height:8px; border-radius:50%; background:var(--dim); display:inline-block;}
  .net.on i{background:var(--ok); box-shadow:0 0 8px var(--ok);} .net.off i{background:var(--bad);}
  @media(max-width:420px){ .net span{display:none;} .logo{font-size:17px;} }
  .langSel{background:var(--panel); color:var(--dim); border:1px solid var(--line); border-radius:8px; padding:5px 8px; font-size:13.5px; cursor:pointer;}
  .screen{display:none; padding:22px 0 40px; animation:fade .25s ease;}
  .screen.on{display:block;}
  @keyframes fade{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}
  .title{font-family:'Oswald',sans-serif; font-weight:700; text-transform:uppercase; line-height:.95; margin:0; letter-spacing:.01em; font-size:clamp(52px,11vw,116px);}
  .title span{background:linear-gradient(90deg,var(--gold),#ffe3a3); -webkit-background-clip:text; background-clip:text; color:transparent;}
  .ticker{font-family:'JetBrains Mono',monospace; color:var(--dim); font-size:15px; margin:14px 0 0; letter-spacing:.04em; white-space:nowrap; overflow:hidden;}
  .ticker b{color:var(--gold); font-weight:700;}
  .panel{background:rgba(20,18,27,.93); border:1px solid var(--line); border-radius:16px; padding:20px;}
  .homeGrid{display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:28px;}
  .homeGrid .full{grid-column:1/-1;}
  @media(max-width:680px){ .homeGrid{grid-template-columns:1fr;} }
  label.lb{display:block; font-size:13px; font-weight:700; color:var(--dim); letter-spacing:.06em; margin:0 0 8px;}
  .inp{width:100%; background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:13px 14px; font-size:18px; outline:none;}
  .inp:focus{border-color:var(--fry);}
  .inp.code{font-family:'JetBrains Mono',monospace; text-transform:uppercase; letter-spacing:.3em; font-weight:800; font-size:24px; text-align:center;}
  .btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; border:0; border-radius:12px; padding:14px 20px; font-weight:700; font-size:17px; transition:filter .12s, transform .1s;}
  .btn:active{transform:scale(.97);}
  .btn.main{background:linear-gradient(90deg,var(--fry),var(--fry2)); color:#1c1405;}
  .btn.main:hover{filter:brightness(1.08);}
  .btn.ghost{background:rgba(11,10,16,.6); border:1px solid var(--line); color:var(--text);}
  .btn.ghost:hover{border-color:var(--fry);}
  .btn.sm{padding:9px 14px; font-size:15px; border-radius:10px;}
  .btn[disabled]{opacity:.45; pointer-events:none;}
  .btn.wide{width:100%; margin-top:12px;}
  .row{display:flex; gap:10px; align-items:center; flex-wrap:wrap;}
  .msg{min-height:22px; margin-top:10px; font-size:14.5px; color:var(--bad);}
  .msg.info{color:var(--dim);}
  .card h3{margin:0 0 4px; font-size:19px;}
  .card p{margin:0 0 12px; color:var(--dim); font-size:14.5px;}
  .soloBox{border-color:rgba(233,196,106,.35); background:linear-gradient(120deg,rgba(233,196,106,.09),rgba(233,196,106,.02)), rgba(20,18,27,.93);}
  .soloBox .row{justify-content:space-between;}
  .best{font-family:'Oswald',sans-serif; color:var(--gold); font-size:18px; white-space:nowrap;}
  .seg{display:inline-flex; padding:3px; border-radius:99px; border:1px solid var(--line); background:var(--bg); flex-wrap:wrap;}
  .seg button{border:0; background:none; color:var(--dim); font-weight:700; font-size:14.5px; padding:7px 15px; border-radius:99px;}
  .seg button.on{background:linear-gradient(90deg,var(--fry),var(--fry2)); color:#1c1405;}

  /* lobby */
  .lobbyTop{display:grid; grid-template-columns:auto 1fr; gap:24px; align-items:center;}
  @media(max-width:680px){ .lobbyTop{grid-template-columns:1fr;} }
  .codeBox{text-align:center; padding:18px 26px; border-radius:16px; border:1px solid rgba(255,196,61,.4); background:linear-gradient(140deg,rgba(255,201,60,.10),rgba(255,138,61,.05)), rgba(11,10,16,.8);}
  .codeBox small{display:block; color:var(--dim); font-size:13px; font-weight:700; letter-spacing:.1em;}
  .codeBox .cd{font-family:'JetBrains Mono',monospace; font-weight:800; font-size:clamp(46px,9vw,78px); letter-spacing:.12em; color:var(--fry); line-height:1.1;}
  .codeBox .lnk{font-size:13px; color:var(--dim); word-break:break-all; margin-top:4px;}
  .codeBox .lnk button{background:none; border:1px solid var(--line); border-radius:8px; color:var(--text); font-size:12.5px; padding:3px 9px; margin-left:6px;}
  .settings{display:grid; gap:14px;}
  .setRow{display:flex; align-items:center; gap:12px; flex-wrap:wrap;}
  .setRow > span{min-width:84px; font-size:14px; color:var(--dim); font-weight:700;}
  .pcount{font-family:'Oswald',sans-serif; font-size:22px; margin:26px 0 10px; display:flex; align-items:baseline; gap:10px;}
  .pcount b{color:var(--fry);} .pcount small{color:var(--dim); font-family:'Noto Sans KR',sans-serif; font-size:14px;}
  .chips{display:flex; flex-wrap:wrap; gap:8px;}
  .chip{padding:7px 13px; border-radius:99px; background:var(--panel); border:1px solid var(--line); font-weight:500; font-size:15px; animation:pop .25s ease;}
  .chip.me{border-color:var(--fry); color:var(--fry);}
  @keyframes pop{from{transform:scale(.7); opacity:0;} to{transform:none; opacity:1;}}
  .waitDots::after{content:''; animation:dots 1.4s steps(4) infinite;}
  @keyframes dots{0%{content:'';}25%{content:'.';}50%{content:'..';}75%{content:'...';}}

  /* game */
  .hud{display:flex; align-items:stretch; gap:10px; flex-wrap:wrap;}
  .stat{background:rgba(20,18,27,.93); border:1px solid var(--line); border-radius:12px; padding:6px 14px; min-width:86px;}
  .stat small{display:block; font-size:11.5px; color:var(--dim); font-weight:700; letter-spacing:.08em; white-space:nowrap;}
  .stat b{font-family:'Oswald',sans-serif; font-size:26px; line-height:1.15; white-space:nowrap;}
  .stat.time b{color:var(--fry);}
  .stat.time.low b{color:var(--bad); animation:blink 1s infinite;}
  .stat .hearts{color:var(--bad); letter-spacing:2px; font-size:22px;}
  .stat .hearts i{font-style:normal; color:#3a3445;}
  .stat.streak b{color:var(--gold);}
  @keyframes blink{50%{opacity:.5;}}
  .hud .sp{flex:1;}
  @media(max-width:480px){ .hud{gap:6px;} .stat{min-width:0; padding:5px 10px;} .stat b{font-size:21px;} .stat .hearts{font-size:18px;} .hud .btn.sm{padding:8px 10px;} }
  .tbar{height:5px; border-radius:6px; background:var(--panel); margin:10px 0 0; overflow:hidden;}
  .tbar i{display:block; height:100%; width:100%; background:linear-gradient(90deg,var(--fry),var(--fry2)); transition:width .25s linear;}
  .strip{display:flex; gap:6px; margin-top:10px; overflow:hidden;}
  .strip .brow{flex:1 1 0; min-width:0;}
  .tGrid{display:grid; grid-template-columns:380px minmax(0,1fr); gap:20px; margin-top:14px; align-items:start;}
  @media(max-width:860px){ .tGrid{grid-template-columns:1fr; gap:12px;} .curCol{position:sticky; top:0; z-index:5; padding-top:6px; background:linear-gradient(180deg,var(--bg) 85%,transparent);} }
  .curCol{display:flex; flex-direction:column; gap:10px;}
  .ev{position:relative; border-radius:18px; padding:22px 20px 20px; text-align:center; overflow:hidden;
    background:linear-gradient(160deg,#2a2233,#191520); border:1px solid rgba(233,196,106,.45); box-shadow:0 20px 50px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.06);}
  .ev::before{content:''; position:absolute; inset:8px; border:1px solid rgba(233,196,106,.18); border-radius:12px; pointer-events:none;}
  .ev .em{font-size:58px; line-height:1.1;}
  .ev .tt{font-size:clamp(20px,2.4vw,25px); font-weight:900; margin-top:8px; line-height:1.3; word-break:keep-all;}
  .ev .yr{font-family:'JetBrains Mono',monospace; font-weight:800; font-size:22px; color:var(--gold); margin-top:10px; letter-spacing:.06em;}
  .ev.in{animation:deal .35s ease;}
  .ev.bad{animation:shake .4s ease; border-color:var(--bad);}
  .ev.good{border-color:var(--ok);}
  @keyframes deal{from{transform:translateY(-20px) rotate(-3deg); opacity:0;} to{transform:none; opacity:1;}}
  @keyframes shake{20%,60%{transform:translateX(-10px) rotate(-1deg);}40%,80%{transform:translateX(10px) rotate(1deg);}}
  @media(max-width:860px){ .ev{padding:12px 14px; display:grid; grid-template-columns:auto 1fr; gap:12px; text-align:left; align-items:center;} .ev .em{font-size:40px;} .ev .tt{margin:0; font-size:19px;} .ev .yr{display:none;} }
  .fb{min-height:46px; border-radius:12px; padding:10px 14px; font-weight:700; display:flex; align-items:center; gap:10px; background:rgba(20,18,27,.93); border:1px solid var(--line); color:var(--dim); font-size:15px;}
  .fb.ok{color:var(--ok); border-color:rgba(63,224,160,.4);}
  .fb.bad{color:var(--bad); border-color:rgba(255,84,104,.4);}
  .fb .pts{margin-left:auto; font-family:'Oswald',sans-serif; font-size:22px;}
  @media(max-width:860px){ .fb{min-height:38px; padding:6px 12px; font-size:14px;} }
  .left{font-size:13.5px; color:var(--dim); text-align:center;}
  .tl{position:relative; padding:4px 0 4px 0;}
  .tl::before{content:''; position:absolute; left:84px; top:0; bottom:0; width:2px; background:linear-gradient(180deg,transparent,rgba(233,196,106,.35) 4%,rgba(233,196,106,.35) 96%,transparent);}
  .gap{position:relative; display:flex; align-items:center; width:100%; height:44px; border:0; background:none; padding:0 0 0 70px;}
  .gap span{flex:1; height:30px; border-radius:10px; border:1.5px dashed rgba(233,196,106,.28); display:flex; align-items:center; padding-left:14px; gap:8px; color:rgba(233,196,106,.6); font-weight:700; font-size:14px; transition:all .12s; margin-left:-0px;}
  .gap span::before{content:'＋';}
  .gap:hover span,.gap:focus-visible span{border-color:var(--gold); background:rgba(233,196,106,.1); color:var(--gold);}
  .gap.hint span{border-color:var(--bad); background:rgba(255,84,104,.12); color:var(--bad);}
  .tl.lock .gap{pointer-events:none;}
  .tl.lock .gap span{opacity:.4;}
  .tc{position:relative; display:grid; grid-template-columns:70px 28px minmax(0,1fr); align-items:center; gap:0; min-height:52px;}
  .tc .y{font-family:'JetBrains Mono',monospace; font-weight:800; font-size:14.5px; color:var(--gold); text-align:right; padding-right:8px; line-height:1.2;}
  .tc .y small{display:block; font-size:10.5px; color:var(--dim); font-weight:700;}
  .tc .dot{width:14px; height:14px; border-radius:50%; background:var(--gold); justify-self:center; box-shadow:0 0 0 4px rgba(233,196,106,.15);}
  .tc .bx{display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:12px; background:rgba(27,24,36,.95); border:1px solid var(--line); font-weight:700; font-size:15.5px; line-height:1.3;}
  .tc .bx .e{font-size:22px;}
  .tc.new .bx{border-color:var(--ok); box-shadow:0 0 18px rgba(63,224,160,.25); animation:slot .4s ease;}
  .tc.new .dot{background:var(--ok);}
  .tc.ghost .bx{border-color:var(--bad); background:rgba(255,84,104,.1); color:#ffd0d6;}
  .tc.ghost .dot{background:var(--bad);} .tc.ghost .y{color:var(--bad);}
  .tc.ghost{animation:ghost 1.6s ease forwards;}
  @keyframes slot{from{transform:scaleY(.4); opacity:0;} to{transform:none; opacity:1;}}
  @keyframes ghost{0%{opacity:0; transform:translateX(30px);} 15%{opacity:1; transform:none;} 80%{opacity:1;} 100%{opacity:0;}}
  .done{padding:22px; text-align:center; color:var(--dim);}
  .countdown{position:fixed; inset:0; display:none; place-items:center; background:rgba(11,10,16,.82); z-index:20; backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px);}
  .countdown.on{display:grid;}
  .countdown b{font-family:'Oswald',sans-serif; font-size:min(40vw,240px); color:var(--fry); animation:cnt 1s ease infinite;}
  @keyframes cnt{0%{transform:scale(1.4); opacity:0;}20%{opacity:1; transform:scale(1);}100%{opacity:.2; transform:scale(.9);}}

  /* boards */
  .brow{display:grid; grid-template-columns:28px minmax(0,1fr) auto; gap:8px; align-items:center; padding:7px 10px; border-radius:10px; background:rgba(11,10,16,.85); border:1px solid var(--line); position:relative; overflow:hidden;}
  .brow .bar{position:absolute; left:0; top:0; bottom:0; background:linear-gradient(90deg,rgba(233,196,106,.16),rgba(233,196,106,.04)); transition:width .5s ease; z-index:0;}
  .brow > *{position:relative; z-index:1;}
  .brow .rk{font-family:'Oswald',sans-serif; font-size:16px; color:var(--dim); text-align:center;}
  .brow .nm{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:500;}
  .brow .sc{font-family:'Oswald',sans-serif; font-size:19px; white-space:nowrap;}
  .brow .sc small{font-size:13px; color:var(--dim); margin-left:6px;}
  .brow.me{border-color:var(--fry);} .brow.me .nm{color:var(--fry);}
  .brow.r1 .rk{color:#ffd54a;} .brow.r2 .rk{color:#c9d3e3;} .brow.r3 .rk{color:#e09a5c;}
  .brow.off{opacity:.45;}
  @media(max-width:700px){ .strip .brow:nth-child(n+4){display:none;} .strip .brow{grid-template-columns:auto minmax(0,1fr) auto; padding:5px 8px;} .strip .brow .sc small{display:none;} }
  .boardBig{display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:8px; margin-top:16px;}
  .boardBig .brow{padding:10px 12px;}

  /* result */
  .podium{display:flex; justify-content:center; align-items:flex-end; gap:12px; margin:26px 0 8px;}
  .pod{flex:0 1 180px; text-align:center;}
  .pod .who{font-weight:700; font-size:17px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; padding:0 4px;}
  .pod .pts{color:var(--dim); font-size:14px; margin-bottom:8px;}
  .pod .blkp{border-radius:14px 14px 0 0; display:grid; place-items:start center; padding-top:10px; font-family:'Oswald',sans-serif; font-weight:700; font-size:42px; color:#1c1405; animation:rise .7s ease backwards;}
  .pod.p1 .blkp{height:170px; background:linear-gradient(180deg,#ffd54a,#ff9d3d); animation-delay:.5s;}
  .pod.p2 .blkp{height:120px; background:linear-gradient(180deg,#e6ecf5,#9aa6b8); animation-delay:.25s;}
  .pod.p3 .blkp{height:90px; background:linear-gradient(180deg,#f0b27a,#b8672e);}
  .pod.p1 .who{color:var(--fry); font-size:20px;}
  @keyframes rise{from{transform:scaleY(0); transform-origin:bottom;} to{transform:scaleY(1); transform-origin:bottom;}}
  .myRes{text-align:center; margin:18px 0 0; font-size:18px;}
  .myRes b{color:var(--fry); font-family:'Oswald',sans-serif; font-size:26px;}
  .resTbl{width:100%; border-collapse:collapse; font-size:15px;}
  .resTbl th{font-size:12.5px; color:var(--dim); font-weight:700; letter-spacing:.06em; text-align:left; padding:8px 10px; border-bottom:1px solid var(--line);}
  .resTbl td{padding:9px 10px; border-bottom:1px solid var(--line);}
  .resTbl td.n{font-family:'Oswald',sans-serif; font-size:17px;}
  .resTbl tr.me td{color:var(--fry);}
  .tblWrap{max-height:46vh; overflow:auto; border-radius:12px; border:1px solid var(--line); background:rgba(20,18,27,.93); margin-top:18px;}
  .secT{font-family:'Oswald',sans-serif; font-size:24px; margin:30px 0 10px; letter-spacing:.02em;}
  .hard{display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:10px;}
  .hard .h{display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:12px; align-items:center; padding:12px 14px; border-radius:14px; border:1px solid var(--line); background:rgba(20,18,27,.93);}
  .hard .h .e{font-size:28px;} .hard .h .t{font-weight:700; line-height:1.3;} .hard .h .y{font-family:'JetBrains Mono',monospace; color:var(--gold); font-weight:800; font-size:13.5px;}
  .hard .h .m{font-family:'Oswald',sans-serif; color:var(--bad); font-size:18px; text-align:right; white-space:nowrap;}
  .hard .h .m small{display:block; font-family:'Noto Sans KR',sans-serif; color:var(--dim); font-size:11.5px;}
  .soloRes{text-align:center; margin-top:16px;}
  .soloRes .big{font-family:'Oswald',sans-serif; font-size:clamp(64px,12vw,110px); color:var(--gold); line-height:1;}
  .soloRes p{color:var(--dim); margin:8px 0 0;}
  .soloRes .nb{display:inline-block; margin-top:10px; padding:4px 12px; border-radius:99px; background:rgba(63,224,160,.12); color:var(--ok); font-weight:700;}
  .center{text-align:center;}
  .hide{display:none !important;}
  .toast{position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%) translateY(20px); background:#221e2b; border:1px solid var(--line); border-radius:12px; padding:10px 16px; font-size:15px; opacity:0; transition:all .25s; z-index:30; pointer-events:none; max-width:90vw;}
  .toast.on{opacity:1; transform:translateX(-50%);}
</style>
</head>
<body>
<div class="hall" aria-hidden="true"><div class="rail"></div><div class="yrs"><span>-3000</span><span>-500</span><span>0</span><span>500</span><span>1000</span><span>1500</span><span>1800</span><span>1900</span><span>2000</span></div></div>
<div class="wrap">
  <header>
    <a class="logo" href="../"><span class="fry">🍟</span><span>Frenchfries<b>777</b></span></a>

  var m=S.me, d=S.settings.deck, rec = !save.best[d] || m.score>save.best[d];
  if(rec && m.score>0){ save.best[d]=m.score; lsSet(SAVE_KEY, JSON.stringify(save)); }
  $('raceRes').classList.add('hide'); $('soloRes').classList.remove('hide');
  $('soloRes').innerHTML='<div class="big">'+m.score+'</div><p>'+esc(tr('{0} · 정답 {1}개 · 최고 연속 {2}', tr(DECK_NAME[d]), m.correct, m.best))+'</p>'+(rec&&m.score>0?'<span class="nb">'+esc(tr('최고 기록!'))+'</span>':'');
  var miss=S.missList||[];
  renderHard(miss.map(function(c){ return { c:c, m:1, n:1 }; }), true);
  $('againBtn').classList.remove('hide'); $('resWait').textContent='';
  show('sResult');

var lockT=null, inputLock=false, ghost=null;
function enterGame(){
  S.missList=[]; ghost=null; inputLock=false;
  document.querySelectorAll('#sGame .solo').forEach(function(el){ el.classList.toggle('hide', S.mode!=='solo'); });
  document.querySelectorAll('#sGame .race').forEach(function(el){ el.classList.toggle('hide', S.mode!=='race'); });
  $('endNow2').classList.toggle('hide', !(S.mode==='race' && S.role==='host'));
  $('fb').className='fb'; $('fb').innerHTML='';
  renderHud(); renderCur(true); renderTl(); show('sGame');
}
function renderHud(){
  var m=S.me; if(!m) return;
  $('gScore').textContent=m.score; $('gStreak').textContent=m.streak;
  var h=''; for(var i=0;i<LIVES;i++) h+= i<m.lives?'♥':'<i>♥</i>'; $('gHearts').innerHTML=h;
  $('gLeft').textContent = m.done ? '' : tr('남은 카드 {0}장', S.seq.length-m.i);
}
function renderCur(deal){
  var m=S.me, el=$('ev');
  if(m.done){ el.className='ev'; el.innerHTML='<div class="em">🏁</div><div class="tt">'+esc(tr('모든 카드를 놓았어요'))+'</div>'; return; }
  var c=S.seq[m.i];
  el.className='ev'+(deal?' in':'');
  el.innerHTML='<div class="em">'+EV[c][3]+'</div><div class="tt">'+esc(evTitle(c))+'</div><div class="yr">????</div>';
}
function renderTl(newAt){
  var m=S.me, h='', placed=m.placed, canPlay=S.phase==='play' && !m.done && !(S.mode==='solo' && m.lives<=0);
  for(var p=0;p<=placed.length;p++){
    if(ghost && ghost.at===p) h+='<div class="tc ghost"><div class="y">'+yearHtml(ghost.c)+'</div><div class="dot"></div><div class="bx"><span class="e">'+EV[ghost.c][3]+'</span><span>'+esc(evTitle(ghost.c))+'</span></div></div>';
    h+='<button class="gap" data-p="'+p+'"><span>'+esc(tr('여기'))+'</span></button>';
    if(p<placed.length){ var c=placed[p]; h+='<div class="tc'+(newAt===p?' new':'')+'"><div class="y">'+yearHtml(c)+'</div><div class="dot"></div><div class="bx"><span class="e">'+EV[c][3]+'</span><span>'+esc(evTitle(c))+'</span></div></div>'; }
  }
  if(m.done) h+='<div class="done">'+esc(tr('결과를 기다리는 중'))+'</div>';
  var tl=$('tl'); tl.innerHTML=h; tl.classList.toggle('lock', !canPlay || inputLock);
}
$('tl').addEventListener('click', function(e){
  var g=e.target.closest('.gap'); if(!g || inputLock || S.phase!=='play') return;
  var m=S.me; if(!m || m.done) return;
  place(+g.dataset.p);
});
function place(pos){
  var m=S.me, i=m.i, r=applyAns(m, pos);
  if(S.mode==='race'){
    if(S.role==='guest') send(S.conn, { t:'ans', i:i, pos:pos });
    else if(S.role==='host'){ tallyAns(r.c, r.ok); boardDirty=true; }
  }
  var fb=$('fb');
  if(r.ok){
    fb.className='fb ok'; fb.innerHTML='✓ '+esc(evTitle(r.c))+' · '+esc(fmtYear(r.c))+'<span class="pts">+'+r.pts+'</span>';
    ghost=null; renderTl(r.at);
    var nw=$('tl').querySelector('.tc.new'); if(nw) nw.scrollIntoView({block:'nearest', behavior:'smooth'});
    renderCur(true);
  } else {
    S.missList.push(r.c);
    fb.className='fb bad'; fb.innerHTML='✗ '+esc(evTitle(r.c))+' · '+esc(fmtYear(r.c));
    $('ev').className='ev bad';
    inputLock=true; ghost={ c:r.c, at:r.at }; renderTl();
    var gh=$('tl').querySelector('.tc.ghost'); if(gh) gh.scrollIntoView({block:'nearest', behavior:'smooth'});
    clearTimeout(lockT);
    lockT=setTimeout(function(){ inputLock=false; ghost=null; if(S.phase==='play' || S.phase==='count'){ renderCur(true); renderTl(); } if(S.mode==='solo' && m.lives<=0) endSolo(); }, 1400);
  }
  renderHud();
  if(S.mode==='solo' && m.done && m.lives>0) setTimeout(endSolo, 900);
}

function newCode(){ var s=''; for(var i=0;i<5;i++) s+=CODE_CH[Math.floor(Math.random()*CODE_CH.length)]; return s; }
function startHost(name, tries){
  if(noPeerLib()) return;
  tries = tries||0; busy(true);
  $('homeMsg').className='msg info'; $('homeMsg').textContent=tr('방을 만드는 중...');
  destroyPeer();
  S.role='host'; S.name=name; S.code=newCode(); S.players={};
  var p = new Peer(PREFIX+S.code, peerOpts()); S.peer=p;
  p.on('open', function(){ $('homeMsg').textContent=''; busy(false); setNet('on','연결됨'); enterLobby(); });
  p.on('connection', onGuestConn);
  p.on('disconnected', function(){ if(S.peer===p && !p.destroyed){ setNet('off','다시 연결 중'); setTimeout(function(){ if(S.peer===p && !p.destroyed) p.reconnect(); }, 1000); } });
  p.on('error', function(err){
    if(S.peer!==p) return;
    if(err.type==='unavailable-id' && tries<5){ startHost(name, tries+1); return; }
    if(S.phase==='idle'){ $('homeMsg').className='msg'; $('homeMsg').textContent=tr('방을 만들지 못했어요 ({0}). 잠시 후 다시 해 보세요.', err.type); busy(false); destroyPeer(); }
    else if(err.type==='network' || err.type==='server-error' || err.type==='socket-error'){ setNet('off','서버 연결 끊김'); }
  });
}
function onGuestConn(conn){
  conn.on('data', function(d){ handleHostMsg(conn, d); });
  conn.on('close', function(){ dropConn(conn); });
  conn.on('error', function(){ dropConn(conn); });
}
function dropConn(conn){ for(var t in S.players){ var pl=S.players[t]; if(pl.conn===conn){ pl.online=false; pl.conn=null; } } if(S.phase==='lobby') renderChips(); boardDirty=true; }
function send(conn, m){ if(conn && conn.open){ try{ conn.send(m); }catch(e){} } }
function broadcast(m){ for(var t in S.players){ send(S.players[t].conn, m); } }
function onlineCount(){ var c=0; for(var t in S.players) if(S.players[t].online) c++; return c; }
function uniqueName(name, tok){
  var base=name, n=name, i=2, taken=function(x){ if(S.settings.hostPlay && x===S.name && tok!==token) return true; for(var t in S.players) if(t!==tok && S.players[t].name===x) return true; return false; };
  while(taken(n)){ n=base.slice(0,14)+' '+i; i++; }
  return n;
}
function tallyAns(c, ok){ var t=S.tally[c]||(S.tally[c]={n:0,m:0}); t.n++; if(!ok) t.m++; }
function handleHostMsg(conn, d){
  if(!d || typeof d!=='object') return;
  if(d.t==='hello'){
    var tok = String(d.token||'').slice(0,40) || conn.peer;
    var pl = S.players[tok];
    if(!pl){
      if(Object.keys(S.players).length >= MAX_PLAYERS){
        var freed=false;
        if(S.phase==='lobby'){ for(var t in S.players){ if(!S.players[t].online){ delete S.players[t]; freed=true; break; } } }
        if(!freed){ send(conn,{t:'full'}); setTimeout(function(){ conn.close(); }, 500); return; }
      }
      pl = S.players[tok] = { name:'', conn:null, online:true, play: S.seq.length?newPlay():null };
    }
    if(pl.conn && pl.conn!==conn){ try{ pl.conn.close(); }catch(e){} }
    pl.conn=conn; pl.online=true; conn._tok=tok;
    pl.name = uniqueName(cleanName(d.name), tok);
    if((S.phase==='play'||S.phase==='count') && !pl.play) pl.play=newPlay();
    send(conn, { t:'welcome', name:pl.name, settings:S.settings, phase:S.phase, remain:S.endAt-Date.now(), total:S.totalMs, seed:S.seed, play:pl.play });
    if(S.phase==='result') send(conn, endMsg());
    if(S.phase==='lobby') renderChips();
    boardDirty=true;
    return;
  }
  var pl2 = S.players[conn._tok]; if(!pl2) return;
  if(d.t==='rename' && S.phase==='lobby'){ pl2.name = uniqueName(cleanName(d.name), conn._tok); send(conn, { t:'named', name:pl2.name }); renderChips(); return; }
  if(d.t==='ans' && S.phase==='play' && pl2.play && !pl2.play.done && (d.i|0)===pl2.play.i){
    var r=applyAns(pl2.play, d.pos|0); tallyAns(r.c, r.ok); boardDirty=true;
  }
}
function enterLobby(){
  S.phase='lobby'; S.mode=null;
  $('lobbyCode').textContent = S.code;
  var isHost = S.role==='host';
  $('hostSet').classList.toggle('hide', !isHost);
  $('guestWait').classList.toggle('hide', isHost);
  if(isHost){
    var url = location.origin+location.pathname+'?room='+S.code+(qs.get('ps')?'&ps='+encodeURIComponent(qs.get('ps')):'');
    $('lobbyLink').innerHTML = esc(url.replace(/^https?:\/\//,''))+'<button id="copyLnk">'+tr('복사')+'</button>';
    $('copyLnk').onclick=function(){ (navigator.clipboard ? navigator.clipboard.writeText(url) : Promise.reject()).then(function(){ toast(tr('링크를 복사했어요')); }, function(){ toast(url); }); };
    syncSegs();
    for(var t in S.players){ var p=S.players[t]; if(!p.online) delete S.players[t]; else p.play=null; }
    broadcast({ t:'lobby', settings:S.settings });
  } else { $('lobbyLink').textContent=''; renderGuestSet(); }
  $('renameIn').value = S.name;
  renderChips(); show('sLobby');
}
function renderGuestSet(){ var s=S.settings; $('guestSet').textContent = tr('{0} · {1}', fmt(s.time*1000), tr(DECK_NAME[s.deck]||'한국사')); }
function bindSeg(id, key, str){
  $(id).addEventListener('click', function(e){
    var b=e.target.closest('button'); if(!b) return;
    S.settings[key] = str ? b.dataset.v : +b.dataset.v; syncSegs(); renderChips();
    broadcast({ t:'lobby', settings:S.settings });
  });
}
bindSeg('segTime','time'); bindSeg('segDeck','deck',true); bindSeg('segHostPlay','hostPlay');
function syncSegs(){ [['segTime','time'],['segDeck','deck'],['segHostPlay','hostPlay']].forEach(function(a){ $(a[0]).querySelectorAll('button').forEach(function(b){ b.classList.toggle('on', String(b.dataset.v)===String(S.settings[a[1]])); }); }); }
var lobbyNames=[], guestCount=0;
function renderChips(){
  var names=[];
  if(S.role==='host'){
    if(S.settings.hostPlay) names.push({n:S.name, me:true});
    for(var t in S.players){ var p=S.players[t]; if(p.online) names.push({n:p.name}); }
    broadcast({ t:'players', names:names.map(function(x){ return x.n; }), guests:onlineCount() });
    guestCount = onlineCount();
    $('startBtn').disabled = names.length===0;
  } else names = lobbyNames.map(function(n){ return {n:n, me:n===S.name}; });
  $('pNum').textContent = guestCount;
  $('chips').innerHTML = names.map(function(x){ return '<span class="chip'+(x.me?' me':'')+'">'+esc(x.n)+'</span>'; }).join('') || '<span class="msg info">'+tr('아직 아무도 없어요')+'</span>';
}
$('startBtn').onclick = function(){
  if(S.role!=='host') return;
  var cdMs=3000; S.seed=(Math.random()*4294967296)>>>0; S.seq=makeSeq(S.settings.deck, S.seed); S.tally={};
  for(var t in S.players) S.players[t].play=newPlay();
  broadcast({ t:'start', cd:cdMs, dur:S.settings.time*1000, settings:S.settings, seed:S.seed });
  beginRace(cdMs, S.settings.time*1000);
};
$('leaveBtn').onclick = goHome;
$('renameBtn').onclick = function(){
  var n=$('renameIn').value.trim(); if(!n || S.phase!=='lobby') return;
  n=cleanName(n);
  if(S.role==='host'){ S.name=n; lsSet('timeline.name', n); renderChips(); toast(tr('이름을 바꿨어요')); }
  else send(S.conn, { t:'rename', name:n });
};
$('renameIn').addEventListener('keydown', function(e){ if(e.key==='Enter') $('renameBtn').click(); });
$('endNow2').onclick = $('endNowBtn').onclick = function(){ if(S.role==='host' && S.phase==='play') finishRace(); };

function startGuest(name, code){
  if(noPeerLib()) return;
  busy(true); $('homeMsg').className='msg info'; $('homeMsg').textContent=tr('방에 연결하는 중...');
  destroyPeer();
  S.role='guest'; S.name=name; S.code=code;
  var p = new Peer(peerOpts()); S.peer=p;
  var tm = setTimeout(function(){ if(S.peer===p && S.phase==='idle'){ $('homeMsg').className='msg'; $('homeMsg').textContent=tr('연결 시간이 초과됐어요. 코드를 확인하고 다시 해 보세요.'); busy(false); destroyPeer(); } }, 15000);
  p.on('open', function(){ connectHost(p, tm); });
  p.on('disconnected', function(){ if(S.peer===p && !p.destroyed) setTimeout(function(){ if(S.peer===p && !p.destroyed) p.reconnect(); }, 1000); });
  p.on('error', function(err){
    if(S.peer!==p) return;
    if(S.phase==='idle'){ clearTimeout(tm); $('homeMsg').className='msg'; $('homeMsg').textContent = err.type==='peer-unavailable' ? tr('방을 찾을 수 없어요. 코드를 확인하세요.') : tr('연결하지 못했어요 ({0}).', err.type); busy(false); destroyPeer(); }
    else if(err.type==='peer-unavailable'){ setNet('off','방장과 연결 끊김'); }
  });
}
var retryT=null, retries=0;
function connectHost(p, tm){
  var c = p.connect(PREFIX+S.code, { reliable:true });
  c.on('open', function(){ clearTimeout(tm); retries=0; S.conn=c; setNet('on','연결됨'); send(c, { t:'hello', name:S.name, token:token }); });
  c.on('data', function(d){ handleGuestMsg(d); });
  c.on('close', function(){
    if(S.conn!==c || S.peer!==p) return;
    S.conn=null; setNet('off','방장과 연결 끊김');
    if(S.phase!=='idle' && retries<8){ retries++; clearTimeout(retryT); retryT=setTimeout(function(){ if(S.peer===p) connectHost(p); }, 1500); }
    else if(S.phase==='lobby'){ toast(tr('방장과 연결이 끊겼어요')); goHome(); }
  });
}
function handleGuestMsg(d){
  if(!d || typeof d!=='object') return;
  switch(d.t){
    case 'full': $('homeMsg').className='msg'; $('homeMsg').textContent=tr('방이 가득 찼어요 (최대 40명).'); busy(false); destroyPeer(); show('sHome'); break;
    case 'welcome':
      S.name=d.name; S.settings=d.settings; busy(false); $('homeMsg').textContent='';
      if(d.phase==='play'){
        if(S.phase!=='play'){ S.seed=d.seed>>>0; S.seq=makeSeq(S.settings.deck, S.seed); beginRace(0, Math.max(0,d.remain), d.total, d.play); }
      } else if(d.phase==='lobby' && S.phase!=='lobby') enterLobby();
      break;
    case 'lobby': S.settings=d.settings; if(S.phase!=='lobby') enterLobby(); else renderGuestSet(); break;
    case 'named': S.name=d.name; lsSet('timeline.name', d.name); $('renameIn').value=d.name; renderChips(); toast(tr('이름을 바꿨어요')); break;
    case 'players': lobbyNames=d.names||[]; guestCount=d.guests|0; if(S.phase==='lobby') renderChips(); break;
    case 'start': S.settings=d.settings; S.seed=d.seed>>>0; S.seq=makeSeq(S.settings.deck, S.seed); beginRace(d.cd, d.dur); break;
    case 'board': S.board=d; renderStrip(); break;
    case 'end': showResult(d); break;
  }
}

var timers=[], tickT=null, boardT=null, boardDirty=false;
function clearTimers(){ timers.forEach(clearTimeout); timers=[]; clearInterval(tickT); clearInterval(boardT); clearTimeout(lockT); inputLock=false; $('cd').classList.remove('on'); }
function iPlay(){ return S.role!=='host' || !!S.settings.hostPlay; }
function validPlay(p){ // restored state from the host
  if(!p || !Array.isArray(p.placed)) return null;
  return { placed:p.placed.map(Number), i:p.i|0, score:p.score|0, correct:p.correct|0, wrong:p.wrong|0, streak:p.streak|0, best:p.best|0, last:p.last||0, lives:LIVES, done:!!p.done };
}
function beginRace(cdMs, durMs, totalMs, resume){
  clearTimers();
  var now=Date.now();
  S.endAt=now+cdMs+durMs; S.totalMs=totalMs||durMs;
  S.mode='race'; S.board=null;
  S.me = validPlay(resume) || newPlay();
  S.phase = cdMs>0 ? 'count' : 'play';
  if(iPlay()){ $('gStrip').innerHTML=''; $('gRank').textContent='-'; enterGame(); }
  else { $('wCode').textContent=S.code; $('wBoard').innerHTML=''; show('sWatch'); }
  if(cdMs>0){
    $('cd').classList.add('on');
    (function step(k){ $('cdNum').textContent=k; $('cdNum').style.animation='none'; void $('cdNum').offsetWidth; $('cdNum').style.animation=''; if(k>1) timers.push(setTimeout(function(){ step(k-1); }, 1000)); })(Math.round(cdMs/1000));
    timers.push(setTimeout(function(){ $('cd').classList.remove('on'); S.phase='play'; if(iPlay()) renderTl(); }, cdMs));
  }
  tickT=setInterval(tick, 250); tick();
  if(S.role==='host'){ boardDirty=true; boardT=setInterval(function(){ if(boardDirty){ boardDirty=false; pushBoard(); } }, 800); }
}
function tick(){
  var left=S.endAt-Date.now(), txt=fmt(Math.min(left, S.totalMs)), pct=Math.max(0,Math.min(1,left/S.totalMs))*100;
  $('gTime').textContent=txt; $('wTime').textContent=txt; $('gBar').style.width=pct+'%'; $('wBar').style.width=pct+'%';
  var low=left<=15000; $('gTimeBox').classList.toggle('low',low); $('wTimeBox').classList.toggle('low',low);
  if(left<=0 && S.phase==='play'){
    if(S.role==='host') finishRace();
    else { S.phase='wait'; $('fb').className='fb'; $('fb').textContent=tr('시간 종료'); renderTl(); }
  }
}
function entries(){
  var arr=[];
  for(var t in S.players){ var p=S.players[t], q=p.play; if(!q) continue; if(p.online || q.score>0) arr.push({ n:p.name, s:q.score, c:q.correct, w:q.wrong, b:q.best, l:q.last||Infinity, o:p.online, t:t }); }
  if(S.settings.hostPlay && S.me) arr.push({ n:S.name, s:S.me.score, c:S.me.correct, w:S.me.wrong, b:S.me.best, l:S.me.last||Infinity, o:true, t:token });
  arr.sort(function(a,b){ return b.s-a.s || a.l-b.l || a.n.localeCompare(b.n); });
  var rk=0, prev=null;
  arr.forEach(function(e,i){ if(!prev || e.s!==prev.s || e.l!==prev.l) rk=i+1; e.r=rk; prev=e; });
  return arr;
}
function rowHtml(e, max, me){
  return '<div class="brow'+(me?' me':'')+(e.r<=3?' r'+e.r:'')+(e.o===false?' off':'')+'"><div class="bar" style="width:'+(max?Math.round(e.s/max*100):0)+'%"></div><div class="rk">'+e.r+'</div><div class="nm">'+esc(e.n)+'</div><div class="sc">'+e.s+'<small>✓'+e.c+'</small></div></div>';
}
function pushBoard(){
  var r=entries(), max=r.length?r[0].s:0, top=r.slice(0,5), total=0;
  r.forEach(function(e){ total+=e.c; });
  r.forEach(function(e){ var p=S.players[e.t]; if(p && p.conn && p.conn.open) send(p.conn, { t:'board', top:top.map(function(x){ return { r:x.r, n:x.n, s:x.s, c:x.c, me:x.t===e.t }; }), max:max, n:r.length, me:{ r:e.r, s:e.s } }); });
  $('wTotal').textContent=total;
  $('wBoard').innerHTML = r.map(function(e){ return rowHtml(e, max, false); }).join('') || '<div class="msg info">'+tr('참가자를 기다리는 중')+'</div>';
  if(S.settings.hostPlay){ var mine=r.filter(function(e){ return e.t===token; })[0]; S.board={ top:top.map(function(x){ return { r:x.r, n:x.n, s:x.s, c:x.c, me:x.t===token }; }), max:max, n:r.length, me:mine?{ r:mine.r, s:mine.s }:null }; renderStrip(); }
}
function renderStrip(){ var b=S.board; if(!b) return; $('gStrip').innerHTML=b.top.map(function(e){ return rowHtml(e, b.max, e.me); }).join(''); if(b.me) $('gRank').textContent=b.me.r+'/'+b.n; }
function endMsg(){
  var r=entries().map(function(e){ return { r:e.r, n:e.n, s:e.s, c:e.c, w:e.w, b:e.b, t:e.t }; });
  var hard=Object.keys(S.tally).map(Number).filter(function(c){ return S.tally[c].m>0; }).map(function(c){ return { c:c, m:S.tally[c].m, n:S.tally[c].n }; });
  hard.sort(function(a,b){ return b.m-a.m || (b.m/b.n)-(a.m/a.n); });
  return { t:'end', ranking:r, hard:hard.slice(0,6) };
}
function finishRace(){ clearTimers(); S.phase='result'; var m=endMsg(); broadcast(m); showResult(m); }
function renderHard(list, solo){
  $('hardWrap').classList.toggle('hide', !list.length);
  $('hard').innerHTML = list.map(function(h){
    var c=h.c; if(!EV[c]) return '';
    return '<div class="h"><span class="e">'+EV[c][3]+'</span><div><div class="t">'+esc(evTitle(c))+'</div><div class="y">'+esc(fmtYear(c))+'</div></div>'+(solo?'':'<div class="m">'+h.m+'<small>'+esc(tr('{0}명 중', h.n))+'</small></div>')+'</div>';
  }).join('');
}
function showResult(d){
  clearTimers(); S.phase='result';
  $('raceRes').classList.remove('hide'); $('soloRes').classList.add('hide');
  var r=d.ranking||[];
  var p=function(i, cls){ var e=r[i]; if(!e) return '<div class="pod '+cls+'" style="visibility:hidden"><div class="blkp"></div></div>'; return '<div class="pod '+cls+'"><div class="who">'+esc(e.n)+'</div><div class="pts">'+tr('{0}점', e.s)+'</div><div class="blkp">'+e.r+'</div></div>'; };
  $('podium').innerHTML = p(1,'p2')+p(0,'p1')+p(2,'p3');
  var mine = r.filter(function(e){ return e.t===token || (S.role==='guest' && e.n===S.name); })[0];
  $('myRes').innerHTML = mine ? (mine.r===1?tr('🏆 우승! '):'')+tr('{0}위 · {1}점 · 정답 {2}개', '<b>'+mine.r+'</b>', '<b>'+mine.s+'</b>', mine.c) : '';
  $('resBody').innerHTML = r.map(function(e){ var acc=(e.c+e.w)?Math.round(e.c/(e.c+e.w)*100)+'%':'-'; return '<tr'+(mine&&e===mine?' class="me"':'')+'><td class="n">'+e.r+'</td><td>'+esc(e.n)+'</td><td class="n">'+e.s+'</td><td class="n">'+e.c+'</td><td>'+acc+'</td><td class="n">'+e.b+'</td></tr>'; }).join('');
  renderHard(d.hard||[], false);
  $('againBtn').classList.toggle('hide', S.role!=='host');
  $('resWait').textContent = S.role==='guest' ? tr('방장이 다시 시작하면 대기실로 이동해요.') : '';
  show('sResult');
}
$('againBtn').onclick = function(){ if(S.role==='host') enterLobby(); else if(S.role==='solo') startSolo(); };
$('homeBtn').onclick = goHome;
window.addEventListener('beforeunload', function(e){ if(S.role==='host' && S.phase!=='idle' && onlineCount()>0){ e.preventDefault(); e.returnValue=''; } });

window.__tl = { S:S, EV:EV, makeSeq:makeSeq, rightPos:rightPos, place:function(p){ place(p); }, right:function(){ return rightPos(S.me.placed, S.seq[S.me.i]); } };
})();
</script>
</body>
</html>
