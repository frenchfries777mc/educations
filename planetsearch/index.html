<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>행성 탐사</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbit&family=IBM+Plex+Sans+KR:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: probe console. Thin instrument strip on top; explore = planet viewfinder + log on the left, the one active task on the right; settle = request queue beside the planet table. Single deliberate dark look (deep space). */
:root {
  --void: #070920;
  --panel: #0a0e2bd9;
  --panel-2: #10163acc;
  --hair: #8fb4ff1f;
  --hair-2: #8fb4ff3d;
  --text: #e9edff;
  --dim: #aab3e0;
  --faint: #6f78ad;
  --ice: #9fe3ff;
  --signal: #ffb547;
  --sea: #52a6ff;
  --ok: #67e3a7;
  --bad: #ff7a7a;
  --f-display: "Orbit", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
html, body { min-height: 100%; }
body {
  background: var(--void);
  background-image:
    radial-gradient(900px 600px at 85% -5%, #3b2a8a88, transparent 70%),
    radial-gradient(800px 700px at 0% 100%, #0f4a7a66, transparent 70%),
    radial-gradient(600px 400px at 40% 50%, #2a1a5a44, transparent 70%);
  background-attachment: fixed;
  color: var(--text); font-family: var(--f-body); font-size: 16px; line-height: 1.6;
}
* { box-sizing: border-box; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--ice); outline-offset: 2px; }
.wrap {
  max-width: 1360px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 72px; display: flex; flex-direction: column; gap: 22px;
}
h1, h2, h3 { font-family: var(--f-display); font-weight: 400; margin: 0; text-wrap: balance; letter-spacing: .01em; word-spacing: -.22em; }
input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
input[type=number] { -moz-appearance: textfield; appearance: textfield; }
h1 { font-size: clamp(44px, 9vw, 76px); line-height: 1.05; }
h2 { font-size: 24px; line-height: 1.25; }
h3 { font-size: 18px; line-height: 1.3; }
p { margin: 0; }
.dim { color: var(--dim); }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.label, .code { font-family: var(--f-mono); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--faint); }
.label { font-family: var(--f-body); letter-spacing: .02em; text-transform: none; font-size: 14px; color: var(--dim); }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

/* Buttons */
.btn { border: 1px solid var(--hair-2); background: transparent; border-radius: 6px; padding: 8px 16px; min-height: 42px; transition: background .15s, border-color .15s, color .15s; }
.btn:hover:not([disabled]) { border-color: var(--ice); color: var(--ice); }
.btn.primary { background: var(--signal); color: #241500; border-color: var(--signal); font-weight: 600; }
.btn.primary:hover:not([disabled]) { background: #ffc56e; color: #241500; border-color: #ffc56e; }
.btn.danger { border-color: transparent; color: var(--faint); }
.btn.danger:hover:not([disabled]) { color: var(--bad); border-color: var(--bad); }
.btn.on { border-color: var(--ice); color: var(--ice); background: #9fe3ff14; }
.btn.sm { min-height: 34px; padding: 4px 12px; font-size: 14px; }
.btn.ghost { border-color: transparent; color: var(--dim); }
.btn.ghost:hover:not([disabled]) { border-color: transparent; color: var(--text); text-decoration: underline; }
.btn.big { font-size: 18px; padding: 14px 28px; align-self: flex-start; font-family: var(--f-display); font-weight: 400; word-spacing: -.22em; }
.btn[disabled] { opacity: .35; cursor: not-allowed; }
.seg { align-self: flex-start; display: inline-flex; border: 1px solid var(--hair-2); border-radius: 6px; overflow: hidden; flex-wrap: wrap; }
.seg .btn { border: 0; border-radius: 0; min-height: 36px; }
.seg .btn + .btn { border-left: 1px solid var(--hair-2); }
.seg .btn.on { background: var(--ice); color: #06142a; }

/* Panels: hairline frame with corner ticks */
.box { position: relative; background: var(--panel); border: 1px solid var(--hair); border-radius: 4px; padding: 22px; display: flex; flex-direction: column; gap: 16px; min-width: 0; backdrop-filter: blur(10px); }
.box::before, .box::after { content: ""; position: absolute; width: 12px; height: 12px; border-color: var(--ice); border-style: solid; opacity: .7; pointer-events: none; }
.box::before { top: -1px; left: -1px; border-width: 1px 0 0 1px; }
.box::after { bottom: -1px; right: -1px; border-width: 0 1px 1px 0; }
.phead { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding-bottom: 12px; border-bottom: 1px solid var(--hair); flex-wrap: wrap; }
.chip { font-size: 13px; padding: 2px 9px; border-radius: 4px; border: 1px solid var(--hair-2); background: transparent; white-space: nowrap; }
.chip.need { border-color: #ffb54766; color: var(--signal); }
.chip.yes { border-color: #67e3a766; color: var(--ok); }
.chip.no { border-color: #ff7a7a66; color: var(--bad); }
.kicker { color: var(--signal); font-family: var(--f-mono); font-size: 12px; letter-spacing: .3em; }

/* HUD strip */
.hud { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: color-mix(in srgb, var(--void) 86%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--hair); }
.hud .inner { max-width: 1360px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px; display: flex; gap: 6px 0; align-items: center; flex-wrap: wrap; }
.hud b { font-family: var(--f-display); font-weight: 400; font-size: 16px; letter-spacing: .04em; padding-right: 20px; margin-right: 4px; border-right: 1px solid var(--hair-2); }
.stat { display: inline-flex; gap: 8px; align-items: center; font-size: 13px; color: var(--faint); padding: 0 16px; border-right: 1px solid var(--hair); }
.stat:last-child { border-right: 0; }
.stat .v { font-family: var(--f-mono); color: var(--text); font-size: 14px; }
.hearts { color: var(--bad); letter-spacing: 3px; font-size: 14px; }
.hearts .off { color: var(--faint); opacity: .5; }
.hudbar { width: 90px; height: 4px; background: #ffffff14; overflow: hidden; }
.hudbar i { display: block; height: 100%; background: var(--ice); }
.hudbar i.full { background: var(--bad); }

/* Explore */
.mission { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px 28px; flex-wrap: wrap; }
.mission h1 { font-size: clamp(40px, 6vw, 64px); }
.mission .code { display: block; margin-bottom: 6px; }
.explore { display: grid; grid-template-columns: minmax(0, 380px) minmax(0, 1fr); gap: 22px; align-items: start; }
@media (max-width: 900px) { .explore { grid-template-columns: minmax(0, 1fr); } .explore > :first-child { order: 2; } }
.side { display: flex; flex-direction: column; gap: 22px; min-width: 0; }
.scope { position: relative; aspect-ratio: 1; width: 100%; max-width: 100%; }
.scope canvas { width: 100%; height: 100%; display: block; }
.trail { display: flex; gap: 6px; align-items: center; }
.trail span { width: 22px; height: 3px; background: #ffffff26; }
.trail span.done { background: var(--ice); }
.trail span.now { background: var(--signal); width: 40px; }
.stepper { display: flex; list-style: none; margin: 0; padding: 0; flex-wrap: wrap; counter-reset: s; }
.stepper li { display: inline-flex; gap: 8px; align-items: center; padding: 8px 16px 8px 0; margin-right: 16px; color: var(--faint); font-size: 14px; border-bottom: 2px solid var(--hair); }
.stepper li span { font-family: var(--f-mono); font-size: 12px; }
.stepper li.now { color: var(--text); border-color: var(--signal); }
.stepper li.now span { color: var(--signal); }
.stepper li.done { color: var(--dim); border-color: var(--ice); }
.stepper li.done span { color: var(--ice); }
.stage { gap: 20px; min-height: 340px; }
.stage .phead h3 { font-size: 22px; }
.bulbs { display: flex; gap: 8px; flex-wrap: wrap; }
.bulb { display: flex; flex-direction: column; align-items: center; gap: 6px; }
button.b { padding: 0; cursor: pointer; } button.b:disabled { cursor: default; }
.bulb .b { width: 48px; height: 56px; border-radius: 4px; border: 1px solid var(--hair-2); background: #050717; display: grid; place-items: center; font-family: var(--f-mono); font-size: 18px; color: var(--faint); }
.bulb .b.lit { background: linear-gradient(#ffd07e, var(--signal)); border-color: var(--signal); color: #2a1800; box-shadow: 0 0 18px #ffb54766, inset 0 1px 0 #fff6; }
.bulb small { font-family: var(--f-mono); font-size: 12px; color: var(--faint); }
.sig { display: flex; flex-direction: column; gap: 18px; }
.decode-in { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.num-in { width: 140px; padding: 10px 14px; font-size: 22px; border-radius: 6px; border: 1px solid var(--hair-2); background: #050717; font-family: var(--f-mono); }
.num-in:focus { border-color: var(--ice); outline: none; box-shadow: 0 0 0 3px #9fe3ff22; }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opts .row > .label { min-width: 70px; }
.formula { font-family: var(--f-mono); font-size: 14px; color: var(--ice); border-left: 2px solid var(--ice); padding: 4px 12px; overflow-x: auto; white-space: nowrap; background: #9fe3ff0d; }
canvas.view { width: min(100%, 260px); max-width: 100%; aspect-ratio: 1; border-radius: 4px; border: 1px solid var(--hair-2); background: #050717; image-rendering: pixelated; }
canvas.wave { width: 100%; max-width: 520px; aspect-ratio: 460 / 150; border-radius: 4px; border: 1px solid var(--hair-2); background: #050717; }
.msg { min-height: 1.5em; font-size: 15px; font-family: var(--f-mono); }
.msg:empty { display: none; }
.msg.ok { color: var(--ok); } .msg.bad { color: var(--bad); } .msg.info { color: var(--signal); }
.sum-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--hair); flex-wrap: wrap; }
.sum-row:first-of-type { border-top: 0; }
.stored { display: flex; flex-direction: column; gap: 2px; font-size: 14px; }
.stored > .row { justify-content: space-between; }
.meter { height: 4px; background: #ffffff14; }
.meter i { display: block; height: 100%; background: var(--ice); }
@media (max-width: 520px) { .bulbs { gap: 4px; flex-wrap: nowrap; } .bulb .b { width: 36px; height: 44px; font-size: 15px; } .bulb small { font-size: 10px; } .box { padding: 18px; } }

/* Settle */
.desk { display: grid; grid-template-columns: minmax(0, 300px) minmax(0, 1fr); gap: 22px; align-items: start; }
@media (max-width: 900px) { .desk { grid-template-columns: minmax(0, 1fr); } }
.window { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 64px); }
@media (max-width: 900px) { .window { position: static; } }
.req { display: flex; flex-direction: column; gap: 10px; padding: 14px; border: 1px solid var(--hair); border-radius: 4px; cursor: pointer; transition: border-color .15s, background .15s; }
.req:hover { border-color: var(--hair-2); }
.req.sel { border-color: var(--ice); background: #9fe3ff0d; }
.req.done { opacity: .6; }
.alien { width: 64px; height: 64px; border-radius: 50% 50% 46% 46%; position: relative; flex: none; box-shadow: inset -6px -8px 0 #00000033; }
.alien::before, .alien::after { content: ""; position: absolute; top: 36%; width: 10px; height: 13px; border-radius: 50%; background: #0c0f2e; }
.alien::before { left: 27%; } .alien::after { right: 27%; }
.alien.mood-angry::before, .alien.mood-angry::after { height: 5px; top: 42%; border-radius: 2px; }
@keyframes bob { 50% { transform: translateY(-4px); } }
.alien.idle { animation: bob 2.2s ease-in-out infinite; }
.filters { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; font-size: 14px; }
.filters label { display: inline-flex; gap: 6px; align-items: center; color: var(--dim); }
.filters input { width: 60px; padding: 5px 8px; border-radius: 4px; border: 1px solid var(--hair-2); background: #050717; font-family: var(--f-mono); font-size: 14px; }
.filters select { padding: 5px 8px; border-radius: 4px; border: 1px solid var(--hair-2); background: #050717; font-size: 14px; }
.tbl-wrap { overflow-x: auto; border-top: 1px solid var(--hair-2); }
table.pt { border-collapse: collapse; width: 100%; min-width: 860px; font-variant-numeric: tabular-nums; }
.pt th, .pt td { padding: 12px 10px; text-align: left; border-bottom: 1px solid var(--hair); white-space: nowrap; vertical-align: middle; }
.pt th { color: var(--faint); font-weight: 400; font-family: var(--f-mono); font-size: 12px; letter-spacing: .06em; }
.pt th button { border: 0; background: none; padding: 0; color: inherit; font: inherit; }
.pt th button:hover { color: var(--ice); }
.pt td.mono { font-size: 16px; }
.pt tbody tr:last-child td { border-bottom: 0; }
.pt tr.pick { cursor: pointer; }
.pt tr.pick:hover td { background: #9fe3ff0a; }
.pt td.unk { color: var(--dim); }
.pt .bin { font-family: var(--f-mono); font-size: 13px; color: var(--signal); letter-spacing: .05em; }
.thumb { width: 40px; height: 40px; border-radius: 3px; border: 1px solid var(--hair-2); image-rendering: pixelated; cursor: zoom-in; }
.mini { width: 72px; height: 30px; border-radius: 3px; border: 1px solid var(--hair-2); cursor: zoom-in; background: #050717; }
.cellflex { display: inline-flex; gap: 8px; align-items: center; }

.rcard { border: 1px solid var(--hair-2); border-radius: 4px; padding: 18px; display: flex; flex-direction: column; gap: 14px; background: #9fe3ff08; }
.rc-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px 20px; }
.rc-cell { display: flex; flex-direction: column; gap: 2px; }
.rc-cell b { font-size: 20px; font-weight: 500; }
.colpick .btn { min-height: 32px; }
/* Modal */
.modal { position: fixed; inset: 0; z-index: 50; background: #04051acc; backdrop-filter: blur(4px); display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.modal .box { width: min(560px, 100%); max-height: 100%; overflow: auto; background: #0a0e2b; }

/* Report, shop and end */
.shop { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
.item { border: 1px solid var(--hair); border-radius: 4px; padding: 16px; display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
.item h3 { font-size: 17px; }
.item .price { font-family: var(--f-mono); color: var(--signal); }
.item.owned { border-color: #67e3a766; }
.lessons { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
.lessons > div { border: 1px solid var(--hair); border-radius: 4px; padding: 16px; font-size: 15px; color: var(--dim); }
.lessons b { display: block; color: var(--text); font-family: var(--f-display); font-weight: 400; font-size: 17px; margin-bottom: 2px; }

/* Home: big centered title over a ringed planet, menu on the left */
canvas.stars { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: -1; pointer-events: none; }
.home { position: relative; min-height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); display: grid; place-items: center; overflow: hidden;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 24px; }
.home-planet { position: absolute; width: min(140vw, 1100px); max-width: none; aspect-ratio: 1; left: 50%; top: 50%; transform: translate(-50%, -50%); opacity: .55; pointer-events: none; }
.home-title { position: relative; text-align: center; display: flex; flex-direction: column; gap: 14px; }
.home-title h1 { font-size: clamp(64px, 14vw, 172px); line-height: .95; letter-spacing: .04em; text-shadow: 0 0 50px #6f8cff88; }
.home-kicker { font-family: var(--f-mono); letter-spacing: .6em; color: var(--ice); font-size: clamp(11px, 1.3vw, 14px); padding-left: .6em; }
.home-menu { position: absolute; left: max(40px, env(safe-area-inset-left, 0px)); top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 4px; align-items: flex-start; z-index: 2; }
.menu-btn { word-spacing: -.22em; display: flex; align-items: center; gap: 14px; min-width: 220px; text-align: left; padding: 12px 0; border: 0; background: none; font-family: var(--f-display); font-size: 24px; color: var(--dim); transition: color .15s, gap .15s; }
.menu-btn::before { content: ""; width: 22px; height: 1px; background: currentColor; transition: width .15s; }
.menu-btn:hover { color: var(--text); }
.menu-btn:hover::before { width: 36px; }
.menu-btn.primary { color: var(--signal); }
.menu-btn.primary::before { height: 2px; }
.ff-cr { position: absolute; right: max(16px, env(safe-area-inset-right, 0px)); bottom: max(10px, env(safe-area-inset-bottom, 0px)); font-family: var(--f-mono); font-size: 11px; color: var(--faint); text-decoration: none; z-index: 2; }
.ff-cr:hover { color: var(--dim); }
.menu-best { color: var(--faint); font-size: 13px; padding: 10px 0 0 36px; font-family: var(--f-mono); }
@media (max-width: 1180px) {
  .home-menu { top: auto; bottom: max(36px, env(safe-area-inset-bottom, 0px)); transform: none; }
}
@media (min-width: 1181px) { .home { padding-left: 220px; } }
@media (max-width: 700px) {
  .home { place-items: start center; padding-top: 16vh; }
  .home-menu { left: max(24px, env(safe-area-inset-left, 0px)); bottom: max(84px, calc(env(safe-area-inset-bottom, 0px) + 72px)); }
}
.home-title h1 { word-spacing: -.32em; }
@media (max-width: 600px) {
  .hud b, .hudbar { display: none; }
  .hud .inner { flex-wrap: wrap; row-gap: 6px; padding-block: 8px; }
  .stat { padding: 0 12px 0 0; margin-right: 12px; font-size: 12px; white-space: nowrap; }
  .stat .v { font-size: 13px; }
  .stepper { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); width: 100%; }
  .stepper li { margin-right: 6px; padding-right: 0; font-size: 12px; flex-direction: column; align-items: flex-start; gap: 0; }
  .stage { min-height: 0; }
}

/* Archive */
.modal .box.arc { width: min(980px, 100%); }
.hud-arc { margin-left: auto; white-space: nowrap; flex: none; }
.modal .box.arc { height: min(860px, 100%); }
.arc-body { flex: 1; min-height: 0; overflow: auto; display: flex; flex-direction: column; gap: 18px; padding-right: 4px; }
.chart .mm rect { fill: #0a0e2b; stroke: #8fb4ff3d; stroke-width: 1.2; }
.chart .mm text { fill: #e9edff; font-size: 14px; }
.chart .mm.root rect { fill: #ffb547; stroke: #ffb547; }
.chart .mm.root text { fill: #241500; font-weight: 600; font-size: 15px; }
.chart .mm.sec rect { stroke: #9fe3ff; fill: #9fe3ff1a; }
.chart .mm.sec text { fill: #9fe3ff; }
.chart .mm.settled rect { stroke: #67e3a7; }
.chart .mm.num rect { stroke: #9fe3ff99; }
.chart .mm.wrong rect { stroke: #ff7a7a; } .chart .mm.wrong text { fill: #ff7a7a; }
.chart .mm.home rect { stroke: #67e3a7; }
.chart g[data-pid], .chart .pickable { cursor: pointer; }
.chart text.pickable:hover, .chart g.pickable:hover text { fill: #9fe3ff; text-decoration: underline; }
.chart .pickable:focus { outline: none; } .chart text.pickable:focus, .chart g.pickable:focus text { fill: #9fe3ff; }
.chart g[data-pid]:hover rect, .chart g[data-pid]:focus rect { stroke: #9fe3ff; fill: #9fe3ff22; }
.chart g[data-pid]:focus { outline: none; }
.chart .mm-link { fill: none; stroke: #8fb4ff4d; stroke-width: 1.5; }
.chart .mm-link.thick { stroke: #9fe3ff88; stroke-width: 2.5; }

.chart { width: 100%; max-width: var(--w); overflow-x: auto; margin-inline: auto; }
.chart svg { display: block; width: 100%; height: auto; min-width: 520px; font-family: var(--f-body); }
.chart .grid { stroke: #8fb4ff1f; stroke-width: 1; }
.chart .axis { stroke: #8fb4ff66; stroke-width: 1.5; }
.chart .tick { fill: #6f78ad; font-size: 12px; font-family: var(--f-mono); }
.chart .lab { fill: #aab3e0; font-size: 14px; }
.chart .val { fill: #e9edff; font-size: 13px; font-family: var(--f-mono); }
.chart .bar { fill: #9fe3ff; }
.chart .bar.wrong { fill: #ff7a7a; }
.chart .pname { fill: #e9edff; font-size: 14px; }
.chart .pt-w, .dot.pt-w { fill: #52a6ff; background: #52a6ff; }
.chart .pt-d, .dot.pt-d { fill: #c99a5b; background: #c99a5b; }
