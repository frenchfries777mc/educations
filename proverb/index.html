<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>속담 탐정</title>
<meta name="description" content="속담과 관용구의 단서를 풀어 사건을 해결하는 국어 수사 게임">
<meta name="theme-color" content="#16110d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
  :root{ --bg:#16110d; --desk:#221a14; --desk2:#2c2219; --line:#4a3a2c; --ink:#f1e6d2; --mute:#a8967d; --brass:#d4a94a; --brass2:#a98529;
    --paper:#f2e8d0; --paper2:#e6d7b4; --pen:#2a2118; --red:#c4342b; --ok:#2f8a57; --stamp:#b3261e; }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--ink);}
  body{font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif; font-size:16px; line-height:1.55; min-height:100vh; min-height:100dvh; overflow-x:hidden;
    padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);
    background:radial-gradient(ellipse 70% 40% at 50% 0%, rgba(212,169,74,.14), transparent 70%),
      repeating-linear-gradient(90deg, rgba(255,255,255,.012) 0 2px, transparent 2px 9px), var(--bg); background-attachment:fixed;}
  button,input,select{font:inherit; color:inherit;}
  button{cursor:pointer; touch-action:manipulation;}
  .hide{display:none !important;}
  .wrap{max-width:1000px; margin:0 auto; padding:0 18px;}
  header{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:16px 0 0;}
  .logo{display:flex; align-items:center; gap:10px; font-family:'Black Han Sans',sans-serif; font-size:22px; color:var(--ink); text-decoration:none; letter-spacing:.02em;}
  .logo svg{width:34px; height:34px; color:var(--brass);}
  .net{font-size:13px; color:var(--mute); display:flex; align-items:center; gap:7px; white-space:nowrap;}
  .net i{width:9px; height:9px; border-radius:50%; background:#5c4d3d; display:inline-block;}
  .net.on i{background:var(--ok); box-shadow:0 0 8px var(--ok);} .net.off i{background:var(--red);}
  @media(max-width:460px){ .net span{display:none;} .logo{font-size:19px;} }
  .screen{display:none; padding:22px 0 56px; animation:in .25s ease;} .screen.on{display:block;}
  @keyframes in{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}
  .msg{min-height:22px; font-size:14px; color:#ff9a86; margin-top:10px;} .msg.info{color:var(--mute);}
  .desk{background:linear-gradient(180deg,var(--desk2),var(--desk)); border:1px solid var(--line); border-radius:14px; padding:18px; box-shadow:inset 0 1px 0 rgba(255,255,255,.05), 0 14px 30px rgba(0,0,0,.35);}
  .lbl{font-family:'Black Han Sans',sans-serif; font-size:14px; color:var(--brass); letter-spacing:.08em; margin:0 0 8px;}
  .btn{white-space:nowrap; background:var(--brass); color:#1d1608; border:0; border-radius:10px; padding:12px 18px; font-weight:700; font-size:17px; box-shadow:0 4px 0 var(--brass2); transition:transform .08s, box-shadow .08s;}
  .btn:active{transform:translateY(3px); box-shadow:0 1px 0 var(--brass2);} .btn:disabled{opacity:.45; cursor:default;}
  .btn.ghost{background:transparent; color:var(--ink); border:1px solid var(--line); box-shadow:none;}
  input[type=text]{width:100%; background:#120d09; border:1px solid var(--line); border-radius:10px; padding:12px 14px; font-size:17px; outline:none;} input[type=text]:focus{border-color:var(--brass);}

  /* home */
  .case{position:relative; text-align:center; margin:6px auto 22px; max-width:560px; background:var(--paper); color:var(--pen); border-radius:6px; padding:30px 24px 26px; transform:rotate(-1.2deg); box-shadow:0 22px 44px rgba(0,0,0,.5);}
  .case::before{content:''; position:absolute; left:50%; top:-12px; width:96px; height:26px; background:rgba(212,169,74,.55); transform:translateX(-50%) rotate(2deg);}
  .case .no{font-family:'Nanum Myeongjo',serif; font-weight:800; letter-spacing:.3em; font-size:13px; color:#7b6240;}
  .case h1{margin:6px 0 4px; font-family:'Black Han Sans',sans-serif; font-weight:400; font-size:clamp(54px,12vw,92px); line-height:1.05; color:#241a10;}
  .case .sub{font-family:'Nanum Myeongjo',serif; font-size:16px; color:#5d4a33;}
  .case .seal{position:absolute; right:18px; bottom:14px; border:3px solid var(--stamp); color:var(--stamp); font-family:'Black Han Sans',sans-serif; font-size:22px; padding:2px 10px; border-radius:6px; transform:rotate(-12deg); opacity:.85;}
  @media(max-width:520px){ .case{padding:28px 18px 40px;} .case .seal{font-size:17px; right:10px; bottom:8px;} }
  .modes{display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:14px; max-width:820px; margin:0 auto;}
  .mode{text-align:left; display:block; width:100%; background:linear-gradient(180deg,var(--desk2),var(--desk)); border:1px solid var(--line); border-radius:14px; padding:16px 18px; box-shadow:0 8px 20px rgba(0,0,0,.3);}
  .mode:hover{border-color:var(--brass);} .mode h3{margin:0; font-family:'Black Han Sans',sans-serif; font-weight:400; font-size:21px; color:var(--brass);} .mode p{margin:4px 0 0; font-size:14.5px; color:var(--mute);}
  .name-row{max-width:820px; margin:0 auto 14px; display:flex; gap:10px;} .name-row button{padding:0 14px; font-size:20px; background:#120d09; border:1px solid var(--line); border-radius:10px;}
  .join{display:flex; gap:8px; margin-top:10px;} .join input{text-transform:uppercase; letter-spacing:.2em; text-align:center; font-weight:700;}
  /* stages */
  .stgs{display:grid; gap:10px; max-width:720px; margin:14px auto 0;}
  .stg{display:flex; gap:14px; align-items:center; text-align:left; width:100%; background:linear-gradient(180deg,var(--desk2),var(--desk)); border:1px solid var(--line); border-radius:12px; padding:14px 16px;}
  .stg:hover{border-color:var(--brass);} .stg .no{font-family:'Black Han Sans',sans-serif; font-size:26px; color:var(--brass); width:40px;}
  .stg .t{display:block; font-weight:700; font-size:18px;} .stg .d{display:block; font-size:14px; color:var(--mute);} .stg .m{display:block; font-size:12.5px; color:var(--brass); margin-top:2px;}
  /* lobby */
  .code{font-family:'Black Han Sans',sans-serif; font-size:clamp(46px,12vw,80px); letter-spacing:.12em; color:var(--brass); text-align:center; margin:4px 0;}
  .lnk{font-size:13px; color:var(--mute); text-align:center; word-break:break-all;} .lnk button{margin-left:8px; background:#120d09; border:1px solid var(--line); border-radius:6px; padding:2px 10px; font-size:13px;}
  .chips{display:flex; flex-wrap:wrap; gap:8px; margin-top:8px;} .chips span{background:#120d09; border:1px solid var(--line); border-radius:99px; padding:4px 12px; font-size:14px;} .chips span.me{border-color:var(--brass); color:var(--brass);}
  .seg{display:flex; gap:6px; flex-wrap:wrap;} .seg button{background:#120d09; border:1px solid var(--line); border-radius:8px; padding:7px 12px; font-size:14px;} .seg button.on{background:var(--brass); color:#1d1608; border-color:var(--brass); font-weight:700;}
  .set-row{margin-top:14px;}
  /* game */
  .grow{display:grid; grid-template-columns:1fr 250px; gap:16px; align-items:start;} .grow.solo{grid-template-columns:1fr;}
  @media(max-width:820px){ .grow{grid-template-columns:1fr;} }
  .hud{display:flex; gap:10px; margin-bottom:12px; flex-wrap:wrap;} .hud div{background:#120d09; border:1px solid var(--line); border-radius:10px; padding:6px 14px; font-size:14px; color:var(--mute);} .hud b{color:var(--ink); font-size:18px; margin-left:6px;}
  .hud .low b{color:#ff8a6b;}
  .paper{position:relative; background:var(--paper); color:var(--pen); border-radius:6px; padding:26px 24px 22px; box-shadow:0 18px 36px rgba(0,0,0,.45); font-family:'Nanum Myeongjo',serif;}
  .paper::before{content:''; position:absolute; left:26px; top:-10px; width:70px; height:22px; background:rgba(212,169,74,.55); transform:rotate(-3deg);}
  .paper .tag{font-family:'Noto Sans KR',sans-serif; font-weight:700; font-size:12.5px; letter-spacing:.14em; color:#7b6240;}
  .paper .q{font-size:clamp(22px,4.6vw,32px); font-weight:800; line-height:1.45; margin:10px 0 4px; color:#241a10;}
  .paper .q .bl{display:inline-block; min-width:3.2em; border-bottom:3px solid var(--stamp); color:var(--stamp); text-align:center;}
  .paper .hint{font-family:'Noto Sans KR',sans-serif; font-size:14.5px; color:#5d4a33; margin-top:4px;}
  .paper .stamp{position:absolute; right:16px; top:16px; border:3px solid; font-family:'Black Han Sans',sans-serif; font-size:22px; padding:0 10px; border-radius:6px; transform:rotate(-10deg); opacity:0; transition:opacity .15s, transform .15s;}
  .paper .stamp.ok{color:var(--ok); border-color:var(--ok); opacity:.9; transform:rotate(-10deg) scale(1);} .paper .stamp.no{color:var(--stamp); border-color:var(--stamp); opacity:.9;}
  .paper .exp{display:none; margin-top:12px; padding-top:10px; border-top:1px dashed #b49e74; font-family:'Noto Sans KR',sans-serif; font-size:15px; color:#3b2e1f;} .paper .exp.on{display:block;} .paper .exp b{font-family:'Nanum Myeongjo',serif; font-size:17px;}
  .opts{display:grid; gap:10px; margin-top:14px;}
  .opt{display:flex; gap:12px; align-items:center; text-align:left; width:100%; background:linear-gradient(180deg,var(--desk2),var(--desk)); border:1px solid var(--line); border-radius:12px; padding:13px 14px; font-size:17px;}
  .opt:hover{border-color:var(--brass);} .opt .n{flex:0 0 30px; height:30px; border-radius:50%; background:var(--brass); color:#1d1608; font-weight:800; display:grid; place-items:center; font-size:15px;}
  .opt.right{border-color:var(--ok); background:rgba(47,138,87,.25);} .opt.wrong{border-color:var(--red); background:rgba(196,52,43,.22);} .opt:disabled{cursor:default;}
  .next{margin-top:12px; text-align:right;}
  .board{max-height:62vh; overflow:auto;} .rrow{display:flex; gap:8px; align-items:center; padding:6px 4px; border-bottom:1px solid rgba(255,255,255,.06); font-size:14.5px;} .rrow.me{background:rgba(212,169,74,.12);} .rrow.r1 .r{color:var(--brass);} .rrow.off{opacity:.5;}
  .rrow .r{width:26px; font-family:'Black Han Sans',sans-serif; color:var(--mute);} .rrow .n{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;} .rrow .p{color:var(--mute); font-size:12.5px;} .rrow .s{font-weight:700; min-width:46px; text-align:right;}
  .cd{position:fixed; inset:0; z-index:50; display:none; place-items:center; background:rgba(10,7,5,.8);} .cd.on{display:grid;} .cd b{font-family:'Black Han Sans',sans-serif; font-size:min(40vw,240px); color:var(--brass);}
  .toast{position:fixed; left:50%; bottom:22px; transform:translateX(-50%) translateY(20px); background:#000c; border:1px solid var(--line); border-radius:99px; padding:8px 18px; font-size:14px; opacity:0; pointer-events:none; transition:.2s; z-index:60;} .toast.on{opacity:1; transform:translateX(-50%);}
  /* result */
  .big{text-align:center; margin:6px 0 14px;} .big .sc{font-family:'Black Han Sans',sans-serif; font-size:clamp(50px,14vw,92px); color:var(--brass); line-height:1;} .big .sm{color:var(--mute);}
  .wr{background:#120d09; border:1px solid var(--line); border-radius:10px; padding:10px 14px; margin-top:8px; font-size:15px;} .wr b{font-family:'Nanum Myeongjo',serif; font-size:17px;} .wr small{display:block; color:var(--mute); margin-top:2px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="logo" href="./"><svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><circle cx="17" cy="17" r="10"/><path d="M25 25l10 10"/><path d="M12 15a7 7 0 0 1 6-4"/></svg>속담 탐정</a>
    <div class="net" id="net"><i></i><span id="netTxt">오프라인</span></div>
  </header>

  <section class="screen on" id="sHome">
    <div class="case"><div class="no">사건 기록 제0001호</div><h1>속담 탐정</h1><div class="sub">단서를 풀어 속담과 관용구 사건을 해결하세요</div><div class="seal">수사 중</div></div>
    <div class="name-row"><input type="text" id="nameIn" maxlength="16" placeholder="탐정 이름" autocomplete="off"><button id="diceBtn" title="이름 뽑기" aria-label="이름 뽑기">🎲</button></div>
    <div class="modes">
      <button class="mode" id="soloBtn"><h3>혼자 수사하기</h3><p>사건 유형을 골라 혼자 풀어요. 최고 기록이 남아요.</p></button>
      <button class="mode" id="hostBtn"><h3>사무소 열기</h3><p>방 코드를 만들어 반 친구들과 같은 사건을 함께 풀어요. 최대 40명.</p></button>
      <div class="mode"><h3>코드로 입장</h3><p>선생님이 알려 준 5자리 코드를 넣어요.</p><div class="join"><input type="text" id="codeIn" maxlength="5" placeholder="CODE" autocomplete="off"><button class="btn" id="joinBtn">입장</button></div></div>
    </div>
    <div class="msg" id="homeMsg" style="text-align:center"></div>
  </section>

  <section class="screen" id="sStages">
    <div class="lbl" style="text-align:center">사건 유형 선택</div>
    <div class="stgs" id="stgList"></div>
    <div style="text-align:center; margin-top:16px"><button class="btn ghost" id="stgBack">뒤로</button></div>
  </section>

  <section class="screen" id="sLobby">
    <div class="desk" style="max-width:720px; margin:0 auto">
      <div class="lbl">사무소 코드</div>
      <div class="code" id="lobbyCode">-----</div>
      <div class="lnk" id="lobbyLink"></div>
      <div class="set-row"><div class="lbl">참가한 탐정 <span id="pNum">0</span>명</div><div class="chips" id="chips"></div></div>
      <div class="set-row"><div class="lbl">내 이름</div><div style="display:flex; gap:8px"><input type="text" id="renameIn" maxlength="16"><button class="btn ghost" id="renameBtn">바꾸기</button></div></div>
      <div id="hostSet">
        <div class="set-row"><div class="lbl">사건 유형</div><div class="seg" id="segStage"></div></div>
        <div class="set-row"><div class="lbl">사건 수</div><div class="seg" id="segCnt"><button data-v="10">10건</button><button data-v="15">15건</button><button data-v="20">20건</button></div></div>
        <div class="set-row"><div class="lbl">제한 시간</div><div class="seg" id="segTime"><button data-v="180">3분</button><button data-v="300">5분</button><button data-v="600">10분</button></div></div>
        <div class="set-row"><div class="lbl">방장도 수사에 참여</div><div class="seg" id="segHostPlay"><button data-v="1">참여</button><button data-v="0">구경만</button></div></div>
      </div>
      <div id="guestWait" class="hide"><div class="msg info" style="font-size:15px" id="guestSet"></div><div class="msg info">방장이 시작하기를 기다리는 중...</div></div>
      <div style="display:flex; gap:10px; margin-top:18px; justify-content:space-between"><button class="btn ghost" id="leaveBtn">나가기</button><button class="btn" id="startBtn">수사 시작</button></div>
    </div>
  </section>

  <section class="screen" id="sGame">
    <div class="hud"><div>사건 <b id="gNo">1/10</b></div><div>점수 <b id="gScore">0</b></div><div id="gTimeBox">남은 시간 <b id="gTime">0:00</b></div><button class="btn ghost hide" id="endNow2" style="padding:6px 14px; font-size:14px">수사 마감</button></div>
    <div class="grow" id="gRow">
      <div>
        <div class="paper" id="paper"><div class="stamp" id="stamp"></div><div class="tag" id="gTag"></div><div class="q" id="gQ"></div><div class="hint" id="gHint"></div><div class="exp" id="gExp"></div></div>
        <div class="opts" id="opts"></div>
        <div class="next"><button class="btn hide" id="nextBtn">다음 사건</button></div>
      </div>
      <div class="desk" id="gSide"><div class="lbl">수사 현황</div><div class="board" id="gBoard"></div><div class="msg info" id="gMeRank"></div></div>
    </div>
  </section>

  <section class="screen" id="sWatch">
    <div class="desk" style="max-width:720px; margin:0 auto">
      <div class="lbl">수사 현황 · 코드 <span id="wCode"></span></div>
      <div class="hud"><div id="wTimeBox">남은 시간 <b id="wTime">0:00</b></div><div>끝낸 탐정 <b id="wDone">0/0</b></div></div>
      <div class="board" id="wBoard"></div>
      <div style="text-align:right; margin-top:12px"><button class="btn ghost" id="endNowBtn">수사 마감</button></div>
    </div>
  </section>

  <section class="screen" id="sResult">
    <div class="desk" style="max-width:760px; margin:0 auto">
      <div class="big"><div class="sm" id="rTitle">수사 결과</div><div class="sc" id="rScore">0</div><div class="sm" id="rSub"></div></div>
      <div id="rRank"></div>
      <div class="lbl" style="margin-top:16px">오답 노트</div><div id="rWrong"></div>
      <div style="display:flex; gap:10px; margin-top:18px; justify-content:space-between; flex-wrap:wrap"><button class="btn ghost" id="homeBtn">처음으로</button><button class="btn" id="againBtn">다시 수사</button></div>
    </div>
  </section>
</div>
<div class="cd" id="cd"><b id="cdNum">3</b></div>
<div class="toast" id="toast"></div>
<script>
(function(){
'use strict';
// [앞부분, 뒷부분, 뜻, 빈칸 낱말, 오답 낱말 3개]
var PV=[
['가는 말이 고와야','오는 말이 곱다','내가 남에게 좋게 해야 남도 나에게 좋게 한다','곱다',['거칠다','짧다','높다']],
['발 없는 말이','천 리 간다','말은 순식간에 멀리 퍼지니 조심해야 한다','천 리',['백 리','한 리','만 리']],
['낮말은 새가 듣고','밤말은 쥐가 듣는다','아무도 안 듣는 것 같아도 말은 새어 나가니 조심해야 한다','쥐',['고양이','개','닭']],
['소 잃고','외양간 고친다','일이 잘못된 뒤에 뒤늦게 대비한다','외양간',['마구간','대문','울타리']],
['호랑이도','제 말 하면 온다','없는 곳에서 어떤 사람 이야기를 하면 마침 그 사람이 나타난다','호랑이',['사자','늑대','곰']],
['원숭이도','나무에서 떨어진다','아무리 잘하는 사람도 실수할 때가 있다','원숭이',['다람쥐','고양이','까치']],
['세 살 버릇','여든까지 간다','어릴 때 몸에 밴 버릇은 늙어서도 고치기 어렵다','여든',['아흔','예순','스물']],
['우물 안','개구리','넓은 세상을 모르고 좁은 생각에 갇혀 있는 사람','개구리',['올챙이','두꺼비','물고기']],
['백지장도','맞들면 낫다','쉬운 일도 힘을 합치면 더 쉽다','맞들면',['찢으면','구기면','접으면']],

function plain(t){ return t.replace(/[{}]/g,''); }
function makeCases(seed,count,sid){
  var r=rng(seed), out=[];
  var pi=shuf(PV.map(function(_,i){ return i; }),r), ii=shuf(ID.map(function(_,i){ return i; }),r), pp=0, ip=0;
  function nextP(){ if(pp>=pi.length){ pi=shuf(pi,r); pp=0; } return PV[pi[pp++]]; }
  function nextI(){ if(ip>=ii.length){ ii=shuf(ii,r); ip=0; } return ID[ii[ip++]]; }
  function pick3(pool,bad){ var a=shuf(pool,r), o=[]; for(var i=0;i<a.length&&o.length<3;i++){ if(a[i]!==bad && o.indexOf(a[i])<0) o.push(a[i]); } return o; }
  function mk(tag,q,hint,right,wrongs,full,meaning){
    var opts=shuf([right].concat(wrongs),r);
    return {tag:tag,q:q,hint:hint,opts:opts,ans:opts.indexOf(right),full:full,meaning:meaning};
  }
  var types;
  if(sid===1) types=['A']; else if(sid===2) types=['B']; else if(sid===3) types=['C']; else if(sid===4) types=['D','E']; else types=['A','B','C','D','E'];
  var seq=[]; for(var k=0;k<count;k++) seq.push(types[k%types.length]);
  if(sid===5) seq=shuf(seq,r);
  seq.forEach(function(t){
    var p, id, full;
    if(t==='A'){ p=nextP(); full=p[0]+' '+p[1];
      out.push(mk('이어 붙이기',esc(p[0])+' <span class="bl">　　　</span>','뒷부분을 찾아 이어 붙이세요.',p[1],pick3(PV.map(function(x){ return x[1]; }),p[1]),full,p[2])); }
    else if(t==='B'){ p=nextP(); full=p[0]+' '+p[1];
      out.push(mk('뜻 풀이','“'+esc(full)+'”','이 속담의 뜻은 무엇일까요?',p[2],pick3(PV.map(function(x){ return x[2]; }),p[2]),full,p[2])); }
    else if(t==='C'){ p=nextP(); full=p[0]+' '+p[1];
      out.push(mk('빈칸 단서',esc(full).replace(esc(p[3]),'<span class="bl">　　</span>'),'빈칸에 들어갈 낱말을 고르세요.',p[3],p[4].slice(),full,p[2])); }
    else if(t==='D'){ id=nextI(); full=plain(id[0]); var ans=/\{(.+?)\}/.exec(id[0])[1];
      out.push(mk('관용구 빈칸',esc(id[0]).replace(/\{.+?\}/,'<span class="bl">　　</span>'),'뜻: '+id[1],ans,id[2].slice(),full,id[1])); }
    else { id=nextI(); full=plain(id[0]);
      out.push(mk('관용구 뜻','“'+esc(full)+'”','이 관용구의 뜻은 무엇일까요?',id[1],pick3(ID.map(function(x){ return x[1]; }),id[1]),full,id[1])); }
  });
  return out;
}

function onGuestConn(conn){ conn.on('data',function(d){ handleHostMsg(conn,d); }); conn.on('close',function(){ dropConn(conn); }); conn.on('error',function(){ dropConn(conn); }); }

function handleHostMsg(conn,d){

(function(){ var h=''; for(var i=1;i<=NSTAGES;i++) h+='<button data-v="'+i+'">'+STAGEDEF[i].n+'</button>'; $('segStage').innerHTML=h; })();

// ---------- 참가자 ----------
function startGuest(name,code){
  if(noPeerLib()||isBusy) return; busy(true); $('homeMsg').className='msg info'; $('homeMsg').textContent='사무소에 연결하는 중...';
  destroyPeer(); S.role='guest'; S.name=name; S.code=code;
  var p=new Peer(peerOpts()); S.peer=p;
  var tm=setTimeout(function(){ if(S.peer===p&&S.phase==='idle'){ $('homeMsg').className='msg'; $('homeMsg').textContent='연결 시간이 초과됐어요. 코드를 확인하고 다시 해 보세요.'; busy(false); destroyPeer(); } },15000);
  p.on('open',function(){ connectHost(p,tm); });
  p.on('disconnected',function(){ if(S.peer===p&&!p.destroyed) setTimeout(function(){ if(S.peer===p&&!p.destroyed) p.reconnect(); },1000); });
  p.on('error',function(err){
    if(S.peer!==p) return;
    if(S.phase==='idle'){ clearTimeout(tm); $('homeMsg').className='msg'; $('homeMsg').textContent=err.type==='peer-unavailable'?'사무소를 찾을 수 없어요. 코드를 확인하세요.':'연결하지 못했어요 ('+err.type+').'; busy(false); destroyPeer(); }
    else if(err.type==='peer-unavailable') setNet('off','방장과 연결 끊김');

}
var retryT=null,retries=0;
function connectHost(p,tm){
  var c=p.connect(PREFIX+S.code,{reliable:true});
  c.on('open',function(){ clearTimeout(tm); retries=0; S.conn=c; setNet('on','연결됨'); send(c,{t:'hello',name:S.name,token:token}); });
  c.on('data',handleGuestMsg);
  c.on('close',function(){
    if(S.conn!==c||S.peer!==p) return; S.conn=null; setNet('off','방장과 연결 끊김');
    if(S.phase!=='idle'&&retries<8){ retries++; clearTimeout(retryT); retryT=setTimeout(function(){ if(S.peer===p) connectHost(p); },1500); }

  });

function handleGuestMsg(d){
  if(!d||typeof d!=='object') return;
  switch(d.t){
    case 'full': $('homeMsg').className='msg'; $('homeMsg').textContent='사무소가 가득 찼어요 (최대 40명).'; busy(false); destroyPeer(); show('sHome'); break;
    case 'welcome':
      S.name=d.name; S.settings=d.settings; busy(false); $('homeMsg').textContent='';
      if(d.phase==='play'||d.phase==='count'){ if(S.phase!=='play'&&S.phase!=='count'){ S.seed=d.seed; beginRound(0,Math.max(0,d.remain),d.total,{score:d.score,stage:d.stage,done:d.done}); } }
      else if(d.phase==='lobby'&&S.phase!=='lobby') enterLobby();
      break;
    case 'lobby': S.settings=d.settings; if(S.phase!=='lobby') enterLobby(); else renderGuestSet(); break;
    case 'named': S.name=d.name; lsSet('proverb.name',d.name); $('renameIn').value=d.name; renderChips(); toast('이름을 바꿨어요'); break;
    case 'players': lobbyNames=d.names||[]; guestCount=d.guests|0; if(S.phase==='lobby') renderChips(); break;
    case 'start': S.settings=d.settings; S.seed=d.seed; beginRound(d.cd,d.dur); break;
    case 'board': S.board=d; renderMyBoard(); break;
    case 'end': showResult(d.ranking); break;
  }
}

// ---------- 라운드 ----------
var timers=[],tickT=null,sendT=null,boardT=null,boardDirty=false,dirtyScore=false,advT=null;
function clearTimers(){ timers.forEach(clearTimeout); timers=[]; clearTimeout(advT); clearInterval(tickT); clearInterval(sendT); clearInterval(boardT); }

function timed(){ return S.role!=='solo'; }
function beginRound(cdMs,durMs,totalMs,resume){

  S.cases=makeCases(S.seed,S.settings.cnt,S.settings.stage);

    $('gRow').classList.toggle('solo',S.role==='solo'); $('gSide').classList.toggle('hide',S.role==='solo');
    $('endNow2').classList.toggle('hide',S.role!=='host'); $('gTimeBox').classList.toggle('hide',!timed());
    $('gBoard').innerHTML=''; $('gMeRank').textContent=''; show('sGame');
    if(S.done||S.cur>=S.cases.length){ S.done=true; waitOthers(); } else if(cdMs>0) timers.push(setTimeout(showCase,cdMs)); else showCase();
    hud();

  if(cdMs>0){ $('cd').classList.add('on'); (function step(k){ $('cdNum').textContent=k; if(k>1) timers.push(setTimeout(function(){ step(k-1); },1000)); })(Math.round(cdMs/1000)); timers.push(setTimeout(function(){ $('cd').classList.remove('on'); S.phase='play'; },cdMs)); }
  tickT=setInterval(tick,250); tick();

// ---------- 순위 ----------
function hostEntries(){
  var arr=[];

  if(S.settings.hostPlay) arr.push({n:S.name,s:S.score,st:S.cur,d:S.doneAt||Infinity,o:true,t:token});

function ranking(){ var rk=0,prev=null; return hostEntries().map(function(e,i){ if(!prev||e.s!==prev.s||e.st!==prev.st) rk=i+1; prev=e; return {r:rk,n:e.n,s:e.s,st:e.st,t:e.t,o:e.o}; }); }

  var r=ranking(),byTok={},done=0; r.forEach(function(e){ byTok[e.t]=e; if(e.st>=S.settings.cnt) done++; });

  for(var t in S.players){ var p=S.players[t]; if(p.conn&&p.conn.open){ var me=byTok[t]; send(p.conn,{t:'board',top:top,n:r.length,me:me?{r:me.r}:null}); } }
  $('wDone').textContent=done+'/'+r.length;
  $('wBoard').innerHTML=r.map(function(e){ return rowHtml(e,false); }).join('')||'<div class="msg info">탐정을 기다리는 중</div>';
  if(S.settings.hostPlay){ S.board={top:top,n:r.length,me:byTok[token]?{r:byTok[token].r}:null}; renderMyBoard(); }
}
function renderMyBoard(){ var b=S.board; if(!b) return; $('gBoard').innerHTML=b.top.map(function(e){ return rowHtml(e,b.me&&e.r===b.me.r&&e.n===S.name); }).join(''); if(b.me) $('gMeRank').innerHTML='내 순위 <b>'+b.me.r+'</b>위 / '+b.n+'명'; }
function finishRound(){ clearTimers(); $('cd').classList.remove('on'); S.phase='result'; if(S.role==='solo'){ showResult(null); return; } var r=ranking(); broadcast({t:'end',ranking:r}); showResult(r); }
function showResult(rk){

  var total=S.cases.length, sid=S.settings.stage;
  $('rScore').textContent=S.score; $('rSub').textContent='정답 '+S.right+'건 / 사건 '+total+'건';
  if(S.role==='solo'){ bestSet(sid,S.score); var b=bestGet()[sid]||0; $('rTitle').textContent=STAGEDEF[sid].n+' · 최고 '+b+'점'; $('rRank').innerHTML=''; }
  else{ $('rTitle').textContent='수사 결과'; var me=null; (rk||[]).forEach(function(e){ if(e.t===token||(S.role!=='host'&&e.n===S.name)) me=e; });
    $('rRank').innerHTML='<div class="board">'+(rk||[]).map(function(e){ return rowHtml(e,me&&e.r===me.r&&e.n===me.n); }).join('')+'</div>'; }
  $('rWrong').innerHTML=S.wrongs.length?S.wrongs.map(function(w){ return '<div class="wr"><b>'+esc(w.full)+'</b><small>뜻: '+esc(w.meaning)+'</small><small>내 답: '+esc(w.picked)+' → 정답: '+esc(w.answer)+'</small></div>'; }).join(''):'<div class="msg info">틀린 사건이 없어요. 완벽한 수사였어요!</div>';
  $('againBtn').classList.toggle('hide',S.role==='guest'); $('againBtn').textContent=S.role==='host'?'사무소로 돌아가기':'다시 수사';
  show('sResult');
}
$('homeBtn').onclick=goHome;
$('againBtn').onclick=function(){ if(S.role==='host'){ enterLobby(); } else if(S.role==='solo'){ showStages(); } };
})();
</script>
